name: CD

# Part 2 of the architecture:
# GitHub -> Actions -> tests -> DVC pipeline -> Docker build -> ECR push -> EC2 pull -> model from DVC remote -> API
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voltguard-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q

  pipeline:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Point DVC at the S3 remote
        run: |
          dvc remote modify --local storage url "s3://${{ secrets.DVC_S3_BUCKET }}/voltguard"
          dvc remote modify --local storage region "${{ secrets.AWS_REGION }}"
      - name: Pull raw data from DVC remote
        run: dvc pull data/raw.dvc
      - name: Run DVC pipeline (ingest, preprocess, train, evaluate, register)
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}   # optional; empty -> local sqlite on the runner
        run: dvc repro
      - name: Quality gate (fail build if test RMSE exceeds thresholds in params.yaml)
        run: |
          python scripts/quality_gate.py
          dvc metrics show
      - name: Push model artifact and intermediate outputs to DVC remote
        run: dvc push
      - name: Upload pipeline results for later jobs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            dvc.lock
            artifacts/metrics/*.json
            artifacts/models/manifest.json

  build-push:
    needs: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the dvc.lock produced by this run (pins the exact model version baked into the image)
        uses: actions/download-artifact@v4
        with:
          name: pipeline-output
          path: pipeline-output
      - run: cp pipeline-output/dvc.lock dvc.lock
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image (tags = commit SHA and latest)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -t "$REGISTRY/$REPO:${{ github.sha }}" -t "$REGISTRY/$REPO:latest" .
          docker push "$REGISTRY/$REPO:${{ github.sha }}"
          docker push "$REGISTRY/$REPO:latest"

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Copy deploy script to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: scripts/deploy.sh
          target: /tmp/voltguard
          strip_components: 1
      - name: Deploy on EC2 (pull image from ECR; container pulls model from DVC remote)
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ needs.build-push.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          DVC_REMOTE_URL: s3://${{ secrets.DVC_S3_BUCKET }}/voltguard
          API_KEY: ${{ secrets.API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,DVC_REMOTE_URL,API_KEY
          script: bash /tmp/voltguard/deploy.sh
      - name: Smoke-test the public endpoint
        run: curl --fail --retry 10 --retry-delay 6 --retry-connrefused "http://${{ secrets.EC2_HOST }}/health"

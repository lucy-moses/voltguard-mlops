name: CD

# Part 2 of the architecture:
# GitHub -> Actions -> tests -> DVC pipeline -> Docker build -> ECR push -> EC2 pull -> model from DVC remote -> API
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1

concurrency:
  group: voltguard-deploy
  cancel-in-progress: false

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require release configuration and validate HTTPS ingress
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DVC_S3_BUCKET: ${{ secrets.DVC_S3_BUCKET }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          PRODUCTION_HTTPS_URL: ${{ vars.PRODUCTION_HTTPS_URL }}
          PRODUCTION_HTTPS_HOST: ${{ vars.PRODUCTION_HTTPS_HOST }}
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY DVC_S3_BUCKET ECR_REPOSITORY EC2_INSTANCE_ID; do
            value="${!name}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::Required secret or repository variable ${name} is missing or blank."
              exit 1
            fi
          done
          if [[ ! "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]; then
            echo "::error::EC2_INSTANCE_ID must be a valid EC2 instance ID."
            exit 1
          fi
          python3 scripts/validate_production_https_url.py
      - name: Configure AWS credentials for SSM readiness check
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
          mask-aws-account-id: true
      - name: Require the EC2 instance to be online in Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          status="$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
            --query 'InstanceInformationList[0].PingStatus' --output text)"
          if [[ "$status" != "Online" ]]; then
            echo "::error::EC2 instance is not online in Systems Manager; stopping before build or publication."
            exit 1
          fi

  test:
    needs: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Pipeline smoke test (synthetic data)
        run: python scripts/smoke_test.py

  pipeline:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      model_version: ${{ steps.verify.outputs.model_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
          mask-aws-account-id: true
      - name: Point DVC at the S3 remote
        env:
          DVC_S3_BUCKET: ${{ secrets.DVC_S3_BUCKET }}
        run: |
          : "${DVC_S3_BUCKET:?DVC_S3_BUCKET secret is required}"
          dvc remote modify --local storage url "s3://${DVC_S3_BUCKET}/voltguard"
          dvc remote modify --local storage region "${AWS_REGION}"
      - name: Pull all locked DVC outputs
        run: dvc pull
      - name: Reuse the locked release or run changed evaluation stages
        id: evaluation
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          MLFLOW_TRACKING_ALLOWED_HOST: ${{ vars.MLFLOW_TRACKING_ALLOWED_HOST }}
        run: |
          plan="$(dvc repro evaluate --dry 2>&1)"
          printf '%s\n' "$plan"
          if grep -Eq "Running stage '(data_ingestion|preprocess|train|evaluate)':" <<< "$plan"; then
            python scripts/validate_mlflow_tracking_uri.py
            echo "reuse_locked=false" >> "$GITHUB_OUTPUT"
            dvc repro evaluate
          else
            echo "reuse_locked=true" >> "$GITHUB_OUTPUT"
            echo "Evaluation stages are unchanged; validating and reusing the locked model release."
            python scripts/verify_deployment_artifacts.py
          fi
      - name: Validate changed evaluation outputs
        if: steps.evaluation.outputs.reuse_locked != 'true'
        run: python scripts/verify_evaluation_artifacts.py
      - name: Model quality gate (run before MLflow registration)
        run: |
          python scripts/quality_gate.py
          dvc metrics show
      - name: Plan registration and validate approved persistent MLflow
        id: registration
        if: steps.evaluation.outputs.reuse_locked != 'true'
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_ALLOWED_HOST: ${{ vars.MLFLOW_TRACKING_ALLOWED_HOST }}
        run: |
          if ! plan="$(dvc repro register_model --dry 2>&1)"; then
            printf '%s\n' "$plan"
            exit 1
          fi
          printf '%s\n' "$plan"
          if grep -Fq "Stage 'register_model' didn't change, skipping" <<< "$plan"; then
            echo "register_model_needed=false" >> "$GITHUB_OUTPUT"
          elif grep -Fq "Running stage 'register_model':" <<< "$plan"; then
            python scripts/validate_mlflow_tracking_uri.py
            echo "register_model_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Could not confirm whether register_model would run; refusing registration."
            exit 1
          fi
      - name: Register model after changed evaluation
        if: steps.registration.outputs.register_model_needed == 'true'
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: dvc repro register_model
      - name: Verify deployment manifest, lockfile, and model bundle
        id: verify
        run: |
          python scripts/verify_deployment_artifacts.py
          echo "model_version=$(python -c 'import json; print(json.load(open("artifacts/models/manifest.json", encoding="utf-8"))["model_version"])')" >> "$GITHUB_OUTPUT"
      - name: Push model artifact and intermediate outputs to DVC remote
        run: dvc push
      - name: Upload pipeline results for later jobs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            dvc.lock
            artifacts/metrics/*.json
            artifacts/models/manifest.json

  build-push:
    needs: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      model_version: ${{ needs.pipeline.outputs.model_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the dvc.lock produced by this run (pins the exact model version baked into the image)
        uses: actions/download-artifact@v4
        with:
          name: pipeline-output
          path: pipeline-output
      - run: cp pipeline-output/dvc.lock dvc.lock
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
          mask-aws-account-id: true
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image (tags = commit SHA and latest)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -t "$REGISTRY/$REPO:${{ github.sha }}" -t "$REGISTRY/$REPO:latest" .
          docker push "$REGISTRY/$REPO:${{ github.sha }}"
          docker push "$REGISTRY/$REPO:latest"

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials for Systems Manager deployment
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
          mask-aws-account-id: true
      - name: Deploy through Systems Manager using a temporary SecureString API key
        env:
          API_KEY: ${{ secrets.API_KEY }}
          AWS_REGION: ap-south-1
          ECR_REGISTRY: ${{ needs.build-push.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          DVC_REMOTE_URL: s3://${{ secrets.DVC_S3_BUCKET }}/voltguard
          EXPECTED_MODEL_VERSION: ${{ needs.build-push.outputs.model_version }}
          PRODUCTION_HTTPS_URL: ${{ vars.PRODUCTION_HTTPS_URL }}
        run: |
          python scripts/deploy_via_ssm.py

name: CD

# Part 2 of the architecture:
# GitHub -> Actions -> tests -> DVC pipeline -> Docker build -> ECR push -> EC2 pull -> model from DVC remote -> API
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1

concurrency:
  group: voltguard-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Pipeline smoke test (synthetic data)
        run: python scripts/smoke_test.py

  pipeline:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      model_version: ${{ steps.verify.outputs.model_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Point DVC at the S3 remote
        env:
          DVC_S3_BUCKET: ${{ secrets.DVC_S3_BUCKET }}
        run: |
          : "${DVC_S3_BUCKET:?DVC_S3_BUCKET secret is required}"
          dvc remote modify --local storage url "s3://${DVC_S3_BUCKET}/voltguard"
          dvc remote modify --local storage region "${AWS_REGION}"
      - name: Pull all locked DVC outputs
        run: dvc pull
      - name: Run DVC pipeline through evaluation
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: dvc repro evaluate
      - name: Model quality gate (run before MLflow registration)
        run: |
          python scripts/quality_gate.py
          dvc metrics show
      - name: Require persistent MLflow if model registration would rerun
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          plan="$(dvc repro register_model --dry 2>&1)"
          printf '%s\n' "$plan"
          if [[ -z "$MLFLOW_TRACKING_URI" ]] && ! grep -Fq "Stage 'register_model' didn't change, skipping" <<< "$plan"; then
            echo "Model registration would run, but MLFLOW_TRACKING_URI is unset. Configure a persistent registry before registering or deploying a new model."
            exit 1
          fi
      - name: Register or reuse the evaluated model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: dvc repro register_model
      - name: Verify deployment manifest, lockfile, and model bundle
        id: verify
        run: |
          python scripts/verify_deployment_artifacts.py
          echo "model_version=$(python -c 'import json; print(json.load(open("artifacts/models/manifest.json", encoding="utf-8"))["model_version"])')" >> "$GITHUB_OUTPUT"
      - name: Push model artifact and intermediate outputs to DVC remote
        run: dvc push
      - name: Upload pipeline results for later jobs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            dvc.lock
            artifacts/metrics/*.json
            artifacts/models/manifest.json

  build-push:
    needs: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      model_version: ${{ needs.pipeline.outputs.model_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the dvc.lock produced by this run (pins the exact model version baked into the image)
        uses: actions/download-artifact@v4
        with:
          name: pipeline-output
          path: pipeline-output
      - run: cp pipeline-output/dvc.lock dvc.lock
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image (tags = commit SHA and latest)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -t "$REGISTRY/$REPO:${{ github.sha }}" -t "$REGISTRY/$REPO:latest" .
          docker push "$REGISTRY/$REPO:${{ github.sha }}"
          docker push "$REGISTRY/$REPO:latest"

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Copy deploy script to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: scripts/deploy.sh
          target: /tmp/voltguard
          strip_components: 1
      - name: Deploy on EC2 (pull image from ECR; container pulls model from DVC remote)
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_REGION: ap-south-1
          ECR_REGISTRY: ${{ needs.build-push.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          DVC_REMOTE_URL: s3://${{ secrets.DVC_S3_BUCKET }}/voltguard
          API_KEY: ${{ secrets.API_KEY }}
          HOST_PORT: "8000"
          EXPECTED_MODEL_VERSION: ${{ needs.build-push.outputs.model_version }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,DVC_REMOTE_URL,API_KEY,HOST_PORT,EXPECTED_MODEL_VERSION
          script: bash /tmp/voltguard/deploy.sh
      - name: Smoke-test the public endpoint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EXPECTED_MODEL_VERSION: ${{ needs.build-push.outputs.model_version }}
        run: |
          BASE_URL="http://${EC2_HOST}:8000"
          curl --fail --retry 30 --retry-delay 6 --retry-connrefused "${BASE_URL}/health" \
            | jq -e --arg version "${EXPECTED_MODEL_VERSION}" '.status == "ok" and .model_loaded == true and .model_version == $version'
          curl --fail --retry 30 --retry-delay 6 --retry-connrefused "${BASE_URL}/model-info" \
            | jq -e --arg version "${EXPECTED_MODEL_VERSION}" '.model_version == $version and .alias == "champion" and (.aliases_in_manifest | index("champion") != null)'

name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]     # main is handled by cd.yml (which also runs lint + tests)

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Pipeline smoke test (synthetic data - no AWS needed, works on forks/PRs)
        run: python scripts/smoke_test.py

# Environment / infrastructure configuration (not ML hyper-parameters).
paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  models_dir: artifacts/models
  preprocessors_dir: artifacts/preprocessors
  metrics_dir: artifacts/metrics

mlflow:
  tracking_uri: sqlite:///mlflow/mlflow.db   # override with MLFLOW_TRACKING_URI (e.g. http://host:5000)
  artifact_root: mlflow/artifacts
  experiment_name: voltguard-battery

dataset:
  # NASA PCoE Li-ion Battery Aging dataset (public). Verify the URL is still valid; see data/README.md.
  url: https://phm-datasets.s3.amazonaws.com/NASA/5.+Battery+Data+Set.zip

# DVC-tracked parameters: changing any value here invalidates the dependent DVC stage.
seed: 42

ingest:
  batteries: [B0005, B0006, B0007, B0018]   # NASA PCoE files expected as <id>.mat under data/raw
  min_discharge_cycles: 20

features:
  nominal_capacity_ah: 2.0     # NASA cells are rated 2 Ah; SOH = capacity / nominal * 100
  eol_soh_percent: 70.0        # End-of-life definition: first cycle with SOH <= 70 %

validation:
  voltage_range: [0.0, 5.0]
  temperature_range: [-20.0, 90.0]
  min_capacity_ah: 0.1
  max_capacity_ah: 3.0
  min_duration_s: 1.0
  max_null_fraction: 0.2

# Split BY BATTERY (never by row) so no cell appears in two splits -> no cross-cell leakage.
split:
  train: [B0005, B0006]
  val: [B0007]
  test: [B0018]

train:
  models:
    linear_regression: {}
    ridge: {alpha: 1.0}
    random_forest: {n_estimators: 300, max_depth: 12, min_samples_leaf: 2, n_jobs: -1}
    gradient_boosting: {n_estimators: 300, learning_rate: 0.05, max_depth: 3, subsample: 0.8}
    xgboost: {n_estimators: 400, learning_rate: 0.05, max_depth: 4, subsample: 0.8, colsample_bytree: 0.8, n_jobs: 2}

# Reproducible model-selection rule (evaluated on the VALIDATION split, per target)
selection:
  primary_metric: rmse          # lower is better
  secondary_metrics: [mae, r2]  # tie-break: lower MAE, then higher R2
  tie_tolerance: 0.01           # models within 1 % of best RMSE count as tied

registry:
  model_name: VoltGuard-Battery-RUL
  promotion_metric: soh_test_rmse         # candidate -> champion only if strictly better than current champion
  min_relative_improvement: 0.0

# Project policy thresholds used by scripts/quality_gate.py (tune after your first REAL run).
quality_gate:
  max_soh_test_rmse: 10.0       # SOH percentage points
  max_rul_test_rmse: 60.0       # cycles
